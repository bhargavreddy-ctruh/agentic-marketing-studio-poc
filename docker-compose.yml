services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ams-backend
    ports:
      - "8000:8000"
    volumes:
      # Real, live-found fix (2026-09-26), made portable: a NAMED volume, not a bind mount of
      # this Mac's own `~/.cache/huggingface` — that path wouldn't exist (or would be empty) on
      # any other machine, silently reintroducing the exact hang this was meant to fix. A named
      # volume still gets the caching benefit (fast on every restart AFTER the first) on whatever
      # machine this actually runs on, with zero dependency on host state.
      - hf_cache:/root/.cache/huggingface
    # Real, live-found incident (2026-09-29): this used to point at `./backend/.env`, a SECOND
    # env file separate from the one `${VAR}` substitution below always reads (Compose only ever
    # auto-loads `.env` next to this file for substitution, never `backend/.env`) — a deploy that
    # only filled in `backend/.env` silently ran with an empty DATABASE_URL and no error. One file
    # now, read by both mechanisms: `.env.example` at the repo root, copied to `.env` here.
    env_file:
      - ./.env
    environment:
      # Real, live-found root cause (2026-09-26) of the sentence-transformers download hang (0%
      # CPU, no progress): HuggingFace's newer XET transfer backend never completed inside a
      # container network, regardless of caching. This is the actual, portable fix — confirmed
      # against `huggingface_hub`'s own `constants.py` (`HF_HUB_DISABLE_XET`) — forces the older,
      # reliable plain-HTTP download path everywhere, not just here.
      HF_HUB_DISABLE_XET: "1"
      # Real, live-found need (2026-09-26) — devops sets this to wherever the FRONTEND is actually
      # reachable from a real browser for THEIR deployment (their own domain/IP, not this Mac's
      # LAN IP or a since-expired Cloudflare quick-tunnel URL). See `.env.example` at the repo
      # root. Defaults to localhost:3000 if unset, for a same-machine dev run.
      FRONTEND_ORIGINS: "${PUBLIC_FRONTEND_URL:-http://localhost:3000}"
      # Real, live-found incident (2026-09-29): the old SQLite fallback here
      # (`${DATABASE_URL:-sqlite+aiosqlite:////app/poc.db}`) meant a deploy that forgot to set
      # DATABASE_URL in the root `.env` silently started against a separate, empty local SQLite
      # database instead of the real Supabase Postgres one — no error, no warning, just a backend
      # that "worked" (login/register succeeded) against the wrong store, with canvas/session data
      # invisible until the missing `.env` was found by hand. Postgres/Supabase is the only real
      # supported store now (Rules.md section 6 — no silent fallback masking a real deploy
      # mistake): `:?` makes Compose refuse to start at all with a clear error instead of quietly
      # substituting SQLite, the same "deterministic beats a maybe" principle already used
      # elsewhere in this app.
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required — set it in the root .env (see .env.example)}"
      # Real, live-found architecture change (2026-09-30): local disk is no longer a storage
      # backend at all (`core/local_storage.py`'s metadata sidecar — a local file — couldn't be
      # resolved cross-machine, e.g. a session created on one deploy 404ing its own images on a
      # different one; Supabase's `asset_metadata` table + Cloudinary are now the only store, no
      # fallback). This var stays optional here (empty default, no `:?`) deliberately — unlike
      # DATABASE_URL/OLLAMA_BASE_URL above, Cloudinary stays DB-managed via Supabase's
      # `app_settings` table (same pattern as every other API key/secret in this app), changeable
      # live with no redeploy. The container boots fine without it set yet; any actual asset save
      # fails loudly (a real, logged error — never silently wrong) until it's configured.
      CLOUDINARY_URL: "${CLOUDINARY_URL:-}"
      # Product/Brand crawler (2026-09-28) — Ollama revived, scoped ONLY to crawler extraction
      # (services/knowledge/{brand,product}_dna_service.py's crawl_*_from_url methods). General
      # LLM reasoning stays Groq->Replicate (router.py), untouched, so backend does NOT hard-depend
      # on the `ollama` service below — OllamaProvider degrades gracefully to that fallback chain
      # if Ollama is slow to pull its model on first start or briefly unavailable.
      #
      # Real, live-found instruction (2026-09-29, same incident/fix as DATABASE_URL above): no
      # silent fallback here either — `.env` is the one and only place every value this backend
      # needs (database, LangSmith, Ollama) comes from. `:?` makes a missing value fail loudly at
      # `docker compose up` instead of quietly defaulting.
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:?OLLAMA_BASE_URL is required — set it in .env (see .env.example)}"
    networks:
      - app-network
    restart: unless-stopped

  # Product/Brand crawler's extraction model only (2026-09-28 revival) — NOT used for general
  # reasoning, which remains entirely Groq->Replicate. See backend service's OLLAMA_BASE_URL above.
  ollama:
    image: ollama/ollama:latest
    container_name: ams-ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    restart: unless-stopped
    # Pulls gemma2:2b on first start only (a no-op, fast, on every later start since it's already
    # present in the ollama_data volume).
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull ${OLLAMA_MODEL:-gemma2:2b} && wait"]

  frontend:
    build:
      # Real, live-found deploy blocker (2026-09-29): this pointed at `../frontend`, a sibling
      # directory ONE LEVEL ABOVE this repo — confirmed not tracked by git at all, so a fresh
      # `git clone`/`git reset --hard origin/main` on a real EC2 instance (exactly what this
      # repo's own CI/CD does) would never have that directory, and the frontend build would fail
      # outright. Pointed back at the repo's own tracked `./frontend` (poc/frontend) — 45 files,
      # already has its own correct `Dockerfile`/`.dockerignore`/`next.config.js` ("output:
      # standalone"), fully deploy-ready as-is. Any newer frontend work that only ever lived in
      # that untracked sibling directory needs to be committed into THIS `frontend/` before it can
      # reach a real deploy — it was never reachable from a fresh clone regardless of this setting.
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client JS bundle at build time (NEXT_PUBLIC_* vars run in the BROWSER,
        # not in this container) — genuinely can't be an ordinary runtime env var for that reason.
        # Devops sets `PUBLIC_BACKEND_URL` in `.env` to wherever THEIR backend is actually
        # reachable from a browser. Defaults to localhost:8000 for a plain same-machine run with
        # no reverse proxy in front. Real, live-found regression (2026-09-26): set this to an
        # EMPTY string instead when frontend+backend sit behind a shared reverse proxy (e.g. this
        # repo's Caddy tunnel setup, which proxies both on one origin) — an empty value makes the
        # frontend call relative paths ("/api/v1/...") that resolve to whatever host actually
        # served the page, so it keeps working no matter what the public URL is (a Cloudflare
        # quick tunnel's URL changes on every restart; hardcoding it here breaks on the next
        # restart). Uses `-` not `:-` so an explicitly-empty `.env` value is honored as empty,
        # not silently replaced by the localhost default. NOTE: because this is baked in at BUILD
        # time, changing it requires `docker compose build frontend` again — not picked up by
        # just restarting the container.
        NEXT_PUBLIC_API_BASE_URL: "${PUBLIC_BACKEND_URL-http://localhost:8000}"
    container_name: ams-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  hf_cache:
  ollama_data:
