[project]
name = "agentic-marketing-studio-poc"
version = "0.1.0"
description = "Agentic Marketing Studio POC backend — LangGraph orchestration, LlamaIndex knowledge layer, free-tier generation providers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.50",
    "langsmith>=0.1.147",
    "llama-index-core>=0.11.0",
    "sentence-transformers>=3.2.0",
    "python-dotenv>=1.0.1",
    "pillow>=10.4.0",
    "replicate>=1.0.4",
    "huggingface_hub>=1.0.0",
    "python-multipart>=0.0.9",
    "kokoro>=0.9.4",
    "soundfile>=0.14.0",
    "ddgs>=9.16.0",
    "cairosvg>=2.7.1",
    "imagehash>=4.3.1",
    "laya>=0.3.7",
    "faster-whisper>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
