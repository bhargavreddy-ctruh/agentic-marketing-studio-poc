name: Backend CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"

jobs:
  test:
    name: Lint & test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend (with dev deps)
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: backend
        run: ruff check .



  deploy:
    name: Deploy backend to EC2
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (pull latest, rebuild, restart)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          # Deploy path on the EC2 box is fixed by convention (see backend/DEPLOYMENT.md) —
          # devops sets this up once when provisioning the instance, not something CI decides.
          script: |
            set -e
            cd ~/agentic-marketing-studio/poc
            git fetch origin main
            git reset --hard origin/main
            docker compose down
            docker compose up -d --build backend ollama
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8000/health >/dev/null; then
                echo "Backend healthy"
                exit 0
              fi
              echo "Waiting for backend to come up... ($i/12)"
              sleep 5
            done
            echo "Backend did not become healthy in time"
            exit 1
