name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.yml"

jobs:
  test:
    name: Lint & test backend
    runs-on: ubuntu-latest

    # Real, live-found CI break (2026-09-30): `database_url` (backend/src/core/config.py) is a
    # required field with no default as of the "no silent SQLite fallback" fix — every test run
    # since then failed at collection with `pydantic_core.ValidationError: database_url Field
    # required`, since CI has no real DATABASE_URL and must never be handed the real production
    # Supabase one anyway. An ephemeral, disposable Postgres service container gives Settings()
    # something real to construct against, fully isolated from production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend (with dev deps)
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Pytest
        working-directory: backend
        run: pytest

  deploy:
    name: Deploy backend to EC2
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (pull latest, rebuild, restart)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          # Deploy path on the EC2 box is fixed by convention (see backend/DEPLOYMENT.md) —
          # devops sets this up once when provisioning the instance, not something CI decides.
          script: |
            set -e
            cd ~/agentic-marketing-studio/poc
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build backend ollama
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8000/health >/dev/null; then
                echo "Backend healthy"
                exit 0
              fi
              echo "Waiting for backend to come up... ($i/12)"
              sleep 5
            done
            echo "Backend did not become healthy in time"
            exit 1
